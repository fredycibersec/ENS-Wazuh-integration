policy:
  id: "ens_windows"
  file: "ens_windows.yml"
  name: "ENS (Esquema Nacional de Seguridad) - Windows"
  description: "Security configuration checks based on the Spanish National Security Framework (Real Decreto 311/2022) for Windows systems. Work in progress — contributions welcome."
  references:
    - https://www.boe.es/boe/dias/2022/05/03/pdfs/BOE-A-2022-7191.pdf
    - https://github.com/fredycibersec/ENS-Wazuh-integration

requirements:
  title: "Windows"
  description: "Requirements to run this SCA policy"
  condition: all
  rules:
    - 'r:HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion -> ProductName -> r:Windows'

variables:
  $system32: C:\Windows\System32

checks:

  # op.acc.2 — Requisitos de acceso

  - id: 31010
    title: "Ensure minimum password length is 12 or more [op.acc.2] [Básico]"
    description: "Windows password minimum length must be at least 12 characters."
    rationale: "ENS op.acc.2 requires strong password policy. Short passwords are vulnerable to brute force."
    remediation: "Set Minimum password length to 12 in Local Security Policy → Account Policies → Password Policy."
    compliance:
      - ens: "op.acc.2"
      - ens_nivel: "Básico"
    condition: all
    rules:
      - 'r:HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters -> MinimumPasswordLength -> r:^(1[2-9]|[2-9][0-9]|[0-9][0-9][0-9][0-9]*)'

  - id: 31011
    title: "Ensure maximum password age is 90 days or less [op.acc.2] [Básico]"
    description: "Password expiration must be set to 90 days or fewer."
    rationale: "Regular password rotation limits exposure of compromised credentials."
    remediation: "Set Maximum password age to 90 in Local Security Policy."
    compliance:
      - ens: "op.acc.2"
      - ens_nivel: "Básico"
    condition: all
    rules:
      - 'r:HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters -> MaximumPasswordAge -> r:^([0-9]|[1-8][0-9]|90)$'

  # op.acc.6 — Mecanismo de autenticación

  - id: 31030
    title: "Ensure account lockout threshold is 5 or fewer attempts [op.acc.6] [Básico]"
    description: "Accounts must be locked after 5 or fewer failed login attempts."
    rationale: "Account lockout limits brute force attacks on user credentials."
    remediation: "Set Account lockout threshold to 5 in Local Security Policy → Account Lockout Policy."
    compliance:
      - ens: "op.acc.6"
      - ens_nivel: "Básico"
    condition: all
    rules:
      - 'r:HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters -> LockoutBadCount -> r:^[0-5]$'

  - id: 31031
    title: "Ensure Windows Firewall is enabled for all profiles [op.mon.1] [Básico]"
    description: "Windows Defender Firewall must be enabled for Domain, Private, and Public profiles."
    rationale: "A host firewall is a fundamental ENS op.mon.1 control for reducing attack surface."
    remediation: "Enable Windows Defender Firewall for all network profiles via Group Policy or Settings."
    compliance:
      - ens: "op.mon.1"
      - ens_nivel: "Básico"
    condition: all
    rules:
      - 'r:HKLM\SYSTEM\CurrentControlSet\Services\SharedAccess\Parameters\FirewallPolicy\DomainProfile -> EnableFirewall -> 1'
      - 'r:HKLM\SYSTEM\CurrentControlSet\Services\SharedAccess\Parameters\FirewallPolicy\StandardProfile -> EnableFirewall -> 1'
      - 'r:HKLM\SYSTEM\CurrentControlSet\Services\SharedAccess\Parameters\FirewallPolicy\PublicProfile -> EnableFirewall -> 1'

  # op.exp.2 — Configuración de seguridad

  - id: 31100
    title: "Ensure Windows Defender Antivirus is enabled [op.exp.6] [Básico]"
    description: "Windows Defender Antivirus real-time protection must be enabled."
    rationale: "ENS op.exp.6 requires protection against malicious code."
    remediation: "Enable Windows Defender via Settings → Windows Security → Virus & threat protection."
    compliance:
      - ens: "op.exp.6"
      - ens_nivel: "Básico"
    condition: all
    rules:
      - 'r:HKLM\SOFTWARE\Microsoft\Windows Defender -> DisableAntiSpyware -> 0'

  - id: 31101
    title: "Ensure Windows Defender real-time protection is enabled [op.exp.6] [Básico]"
    description: "Real-time monitoring must be active in Windows Defender."
    rationale: "Real-time protection is required for active malware detection."
    remediation: "Enable real-time protection in Windows Security settings."
    compliance:
      - ens: "op.exp.6"
      - ens_nivel: "Básico"
    condition: all
    rules:
      - 'r:HKLM\SOFTWARE\Microsoft\Windows Defender\Real-Time Protection -> DisableRealtimeMonitoring -> 0'

  # op.exp.8 — Registro de actividad

  - id: 31120
    title: "Ensure Windows Event Log (Security) is enabled [op.exp.8] [Básico]"
    description: "Windows Security Event Log must be enabled and active."
    rationale: "ENS op.exp.8 requires logging of user activity. Windows Security log captures authentication events."
    remediation: "Enable the Security event log via Event Viewer or Group Policy."
    compliance:
      - ens: "op.exp.8"
      - ens_nivel: "Básico"
    condition: all
    rules:
      - 'r:HKLM\SYSTEM\CurrentControlSet\Services\EventLog\Security -> Start -> r:^[0-2]$'

  # mp.eq.2 — Bloqueo de puesto de trabajo

  - id: 31400
    title: "Ensure screen lock timeout is 15 minutes or less [mp.eq.2] [Básico]"
    description: "The screen saver or lock screen must activate after 15 minutes of inactivity."
    rationale: "ENS mp.eq.2 requires workstation locking after inactivity."
    remediation: "Set screen saver timeout via Group Policy: User Configuration → Administrative Templates → Control Panel → Personalization."
    compliance:
      - ens: "mp.eq.2"
      - ens_nivel: "Básico"
    condition: all
    rules:
      - 'r:HKCU\Control Panel\Desktop -> ScreenSaveTimeOut -> r:^([0-9]|[1-9][0-9]|[1-8][0-9][0-9]|900)$'

  # mp.sw.2 — Aceptación y puesta en servicio

  - id: 31700
    title: "Ensure Windows automatic updates are enabled [mp.sw.2] [Básico]"
    description: "Windows Update must be configured to automatically download and install updates."
    rationale: "ENS mp.sw.2 requires software to be kept up to date and verified."
    remediation: "Enable Windows Update via Settings → Windows Update → Advanced options."
    compliance:
      - ens: "mp.sw.2"
      - ens_nivel: "Básico"
    condition: all
    rules:
      - 'r:HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\WindowsUpdate\Auto Update -> AUOptions -> r:^[3-9]$|^[1-9][0-9]+'

  # op.acc.6 — Mecanismo de autenticación (cont.)

  - id: 31032
    title: "Ensure Network Level Authentication is required for RDP [op.acc.6] [Básico]"
    description: "Remote Desktop connections must require NLA before the session is established."
    rationale: "NLA authenticates the user before the RDP session is created, preventing pre-authentication attacks and reducing the attack surface."
    remediation: "Set UserAuthentication to 1 under HKLM\\SYSTEM\\CurrentControlSet\\Control\\Terminal Server\\WinStations\\RDP-Tcp, or via Group Policy: Computer Configuration → Administrative Templates → Windows Components → Remote Desktop Services → Require NLA."
    compliance:
      - ens: "op.acc.6"
      - ens_nivel: "Básico"
    condition: all
    rules:
      - 'r:HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp -> UserAuthentication -> 1'

  - id: 31033
    title: "Ensure WDigest authentication is disabled [op.acc.6] [Básico]"
    description: "WDigest must be disabled to prevent plaintext credential storage in LSASS memory."
    rationale: "WDigest causes Windows to cache cleartext credentials in memory, enabling credential dumping. ENS op.acc.6 requires secure authentication mechanisms."
    remediation: "Set UseLogonCredential to 0 under HKLM\\SYSTEM\\CurrentControlSet\\Control\\SecurityProviders\\WDigest."
    compliance:
      - ens: "op.acc.6"
      - ens_nivel: "Básico"
    condition: all
    rules:
      - 'r:HKLM\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest -> UseLogonCredential -> 0'

  # op.acc.3 — Segregación de funciones (cont.)

  - id: 31034
    title: "Ensure UAC prompts administrators for consent or credentials [op.acc.3] [Básico]"
    description: "User Account Control must prompt for consent (2) or credentials (1) when elevating privileges."
    rationale: "ENS op.acc.3 requires segregation of functions. UAC prevents privilege escalation without explicit approval."
    remediation: "Set ConsentPromptBehaviorAdmin to 1 or 2 via Local Security Policy → Security Settings → Local Policies → Security Options → User Account Control."
    compliance:
      - ens: "op.acc.3"
      - ens_nivel: "Básico"
    condition: all
    rules:
      - 'r:HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System -> ConsentPromptBehaviorAdmin -> r:^[1-2]$'

  # op.exp.2 — Configuración de seguridad (cont.)

  - id: 31102
    title: "Ensure SMBv1 protocol is disabled [op.exp.2] [Básico]"
    description: "The SMBv1 protocol must be disabled on the system."
    rationale: "SMBv1 contains critical vulnerabilities including EternalBlue (MS17-010). ENS op.exp.2 requires secure system configuration."
    remediation: "Set SMB1 to 0 under HKLM\\SYSTEM\\CurrentControlSet\\Services\\LanmanServer\\Parameters, or run: Set-SmbServerConfiguration -EnableSMB1Protocol $false"
    compliance:
      - ens: "op.exp.2"
      - ens_nivel: "Básico"
    condition: all
    rules:
      - 'r:HKLM\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters -> SMB1 -> 0'

  # op.exp.8 — Registro de actividad (cont.)

  - id: 31121
    title: "Ensure PowerShell Script Block Logging is enabled [op.exp.8] [Básico]"
    description: "PowerShell script block logging must capture all executed script blocks."
    rationale: "Script block logging records executed PowerShell code and is essential for detecting obfuscated malicious scripts. ENS op.exp.8 requires user activity logging."
    remediation: "Enable via Group Policy: Computer Configuration → Administrative Templates → Windows Components → Windows PowerShell → Turn on PowerShell Script Block Logging."
    compliance:
      - ens: "op.exp.8"
      - ens_nivel: "Básico"
    condition: all
    rules:
      - 'r:HKLM\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging -> EnableScriptBlockLogging -> 1'

  - id: 31200
    title: "Ensure Windows Time service syncs from a valid time source [op.exp.8] [Básico]"
    description: "The W32Time service must be configured to use NTP, NT5DS, or AllSync as time source."
    rationale: "Accurate timestamps are required for audit log integrity. ENS op.exp.8 mandates reliable activity records that depend on synchronized time."
    remediation: "Configure W32Time: w32tm /config /manualpeerlist:<ntp-server> /syncfromflags:manual /reliable:YES /update && net stop w32time && net start w32time"
    compliance:
      - ens: "op.exp.8"
      - ens_nivel: "Básico"
    condition: all
    rules:
      - 'r:HKLM\SYSTEM\CurrentControlSet\Services\W32Time\Parameters -> Type -> r:^(NTP|NT5DS|AllSync)$'

  # op.acc.6 — Nivel Medio

  - id: 31035
    title: "Ensure LSASS runs as Protected Process Light [op.acc.6] [Medio]"
    description: "LSASS must be configured as a Protected Process Light (PPL) to prevent credential dumping."
    rationale: "PPL prevents unprotected processes from reading LSASS memory, blocking tools like Mimikatz. Required for ENS op.acc.6 Medio credential protection."
    remediation: "Set RunAsPPL to 1 under HKLM\\SYSTEM\\CurrentControlSet\\Control\\Lsa. Requires Secure Boot and may require a registry addition before enabling."
    compliance:
      - ens: "op.acc.6"
      - ens_nivel: "Medio"
    condition: all
    rules:
      - 'r:HKLM\SYSTEM\CurrentControlSet\Control\Lsa -> RunAsPPL -> 1'

  - id: 31036
    title: "Ensure Virtualization Based Security is enabled [op.acc.6] [Medio]"
    description: "Virtualization Based Security (VBS) must be enabled to support Credential Guard."
    rationale: "VBS uses hardware virtualization to isolate credential storage from the OS kernel, preventing credential theft even when the kernel is compromised."
    remediation: "Enable via Group Policy: Computer Configuration → Administrative Templates → System → Device Guard → Turn On Virtualization Based Security → Enabled."
    compliance:
      - ens: "op.acc.6"
      - ens_nivel: "Medio"
    condition: all
    rules:
      - 'r:HKLM\SYSTEM\CurrentControlSet\Control\DeviceGuard -> EnableVirtualizationBasedSecurity -> 1'

  # mp.com.2 — Protección de la confidencialidad (cont.)

  - id: 31302
    title: "Ensure RDP uses High or FIPS encryption [mp.com.2] [Medio]"
    description: "Remote Desktop connections must use High (3) or FIPS-compliant (4) encryption level."
    rationale: "ENS mp.com.2 requires confidentiality of communications. Low or client-compatible RDP encryption can be downgraded by an attacker."
    remediation: "Set MinEncryptionLevel to 3 or 4 under HKLM\\SYSTEM\\CurrentControlSet\\Control\\Terminal Server\\WinStations\\RDP-Tcp, or via Group Policy."
    compliance:
      - ens: "mp.com.2"
      - ens_nivel: "Medio"
    condition: all
    rules:
      - 'r:HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp -> MinEncryptionLevel -> r:^[3-4]$'
